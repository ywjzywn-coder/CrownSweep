[package]
name = "mole-gui"
version = "0.3.1"
description = "CrownSweep: an independent macOS GUI powered by tw93/Mole"
license = "GPL-3.0-only"
authors = ["ellaycrown"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mole_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
nix = { version = "0.28", features = ["term"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
