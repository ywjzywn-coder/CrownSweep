[package]
name = "mole-gui"
version = "0.4.0"
description = "CrownSweep: an independent macOS GUI powered by tw93/Mole"
license = "GPL-3.0-only"
authors = ["ellaycrown"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "mole_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
nix = { version = "0.28", features = ["term"] }
tauri-plugin-updater = "2.13.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"
minisign-verify = "0.2.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
